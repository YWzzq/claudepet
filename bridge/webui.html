<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentPet 配置台</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 48px; background: #12141A; color: #E5E7EB;
    font-family: -apple-system, "Hiragino Sans GB", "PingFang SC", sans-serif;
  }
  h1 { font-size: 20px; margin: 0 0 6px; text-align: center; }
  .sub { text-align: center; font-size: 12px; color: #9CA3AF; margin-bottom: 16px; }
  .tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 18px; }
  .tabs button {
    background: #1B1F27; color: #9CA3AF; border: 1px solid #2A3040;
    border-radius: 8px; padding: 9px 22px; font-size: 14px; cursor: pointer;
  }
  .tabs button.on { color: #fff; background: #2563EB; border-color: #2563EB; }
  .panel {
    background: #1B1F27; border: 1px solid #2A3040; border-radius: 14px;
    padding: 20px; max-width: 980px; margin: 0 auto;
  }
  .panel h2 { font-size: 15px; margin: 0 0 12px; color: #93C5FD; }
  .panel h3 { font-size: 13px; margin: 18px 0 8px; color: #93C5FD; }
  .conn { display: flex; gap: 8px; margin-bottom: 14px; }
  .conn input {
    flex: 1; background: #12141A; border: 1px solid #374151; color: #E5E7EB;
    border-radius: 6px; padding: 7px 10px; font-size: 13px;
  }
  button {
    background: #2563EB; color: #fff; border: none; border-radius: 7px;
    padding: 8px 14px; font-size: 13px; cursor: pointer;
  }
  button:hover { filter: brightness(1.15); }
  button.gray { background: #374151; }
  button.red { background: #B91C1C; }
  button.green { background: #15803D; }
  button.small { padding: 4px 9px; font-size: 12px; }
  .states { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .states .chip {
    padding: 6px 12px; border-radius: 16px; font-size: 13px; cursor: pointer;
    background: #262C38; border: 1.5px solid transparent; color: #E5E7EB;
  }
  .states .chip.sel { border-color: #fff; }
  .row { display: flex; align-items: center; gap: 12px; margin: 9px 0; font-size: 14px; }
  .row label { width: 70px; flex-shrink: 0; color: #9CA3AF; }
  input[type=color] { width: 52px; height: 34px; border: none; background: none; cursor: pointer; }
  input[type=range] { flex: 1; }
  select, input[type=text], input[type=number] {
    background: #12141A; border: 1px solid #374151; color: #E5E7EB;
    border-radius: 6px; padding: 6px 10px; font-size: 13px;
  }
  input[type=text] { flex: 1; }
  .ledbox { display: flex; align-items: center; gap: 18px; margin: 12px 0; }
  .led { width: 54px; height: 54px; border-radius: 50%; background: #333; }
  .hint { font-size: 12px; color: #6B7280; line-height: 1.6; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
  .msg { font-size: 12px; margin-top: 8px; min-height: 16px; }
  .msg.ok { color: #4ADE80; } .msg.err { color: #F87171; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }
  .rulecard {
    background: #12141A; border: 1px solid #2A3040; border-radius: 10px;
    padding: 12px; margin-bottom: 10px;
  }
  .rulecard .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .rulecard .head .idx { font-size: 12px; color: #6B7280; }
  .rulegrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .rulegrid .f { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #9CA3AF; }
  .rulegrid .f span { width: 44px; flex-shrink: 0; }
  .rulegrid input, .rulegrid select { width: 100%; }
  .prioRow { display: flex; align-items: center; gap: 10px; margin: 6px 0; font-size: 13px; }
  .prioRow .dot { width: 10px; height: 10px; border-radius: 50%; }
  .prioRow .nm { width: 90px; }
  .prioRow input { width: 70px; }
</style>
</head>
<body>
  <h1>AgentPet 配置台</h1>
  <div class="sub">配方管理写入板子 NVS · 事件绑定写入 mapping.json（保存即热加载）</div>
  <div class="tabs">
    <button id="tabbtn_recipe" class="on" onclick="showTab('recipe')">状态配方</button>
    <button id="tabbtn_bind" onclick="showTab('bind')">事件绑定</button>
  </div>

  <!-- ═══════════ 页签一：状态配方（灯光 + 屏幕 完整配方） ═══════════ -->
  <div class="panel" id="tab_recipe">
    <div class="conn">
      <input id="ip" placeholder="板子 IP，如 192.168.1.188">
      <button onclick="connectBoard()">连接</button>
      <button class="gray" onclick="newRecipe()">＋新增状态</button>
    </div>
    <div class="states" id="stateChips"></div>

    <div class="grid2">
      <div>
        <h3>💡 灯光</h3>
        <div class="row"><label>状态名</label><input type="text" id="f_name" placeholder="1~12位字母数字_"></div>
        <div class="row"><label>颜色</label><input type="color" id="f_color" value="#3BB8E8"></div>
        <div class="row"><label>灯效</label>
          <select id="f_mode">
            <option value="steady">steady 常亮</option>
            <option value="breath">breath 呼吸</option>
            <option value="blink">blink 闪烁</option>
            <option value="double">double 双闪</option>
          </select>
        </div>
        <div class="row"><label>周期</label>
          <input type="range" id="f_period" min="50" max="5000" step="50" value="800"
                 oninput="document.getElementById('f_pv').textContent=value+'ms'">
          <span id="f_pv" style="width:56px">800ms</span>
        </div>
        <div class="ledbox">
          <div class="led" id="ledPreview"></div>
          <div class="hint">LED 实时预览<br>（保存前即可看效果）</div>
        </div>
      </div>
      <div>
        <h3>🖥 屏幕（240×240）</h3>
        <canvas id="screen" width="480" height="480"
                style="width:100%;max-width:300px;border-radius:10px;border:1px solid #2A3040"></canvas>
        <div class="row"><label>背景</label><input type="color" id="s_bg" value="#000000"></div>
        <div class="row"><label>五官色</label><input type="color" id="s_fg" value="#8C9BAB"></div>
        <div class="row"><label>眼睛</label>
          <select id="s_eye">
            <option value="open">open 圆眼</option>
            <option value="wide">wide 瞪大</option>
            <option value="sleep">sleep 闭眼</option>
            <option value="happy">happy 笑眼</option>
            <option value="x">x X 眼</option>
            <option value="heart">heart 爱心眼</option>
            <option value="spiral">spiral 漩涡眼</option>
            <option value="angry">angry 怒眉</option>
          </select>
        </div>
        <div class="row"><label>眼神</label>
          <select id="s_anim">
            <option value="still">still 不动</option>
            <option value="look">look 飘移</option>
            <option value="scan">scan 扫读</option>
            <option value="down">down 向下</option>
          </select>
        </div>
        <div class="row"><label>嘴</label>
          <select id="s_mouth">
            <option value="none">none 无</option>
            <option value="flat">flat 平嘴</option>
            <option value="smile">smile 微笑</option>
            <option value="o">o 圆嘴</option>
            <option value="wave">wave 波浪</option>
            <option value="frown">frown 皱眉</option>
            <option value="tongue">tongue 吐舌</option>
            <option value="prompt">prompt &gt;_</option>
            <option value="question">question ?</option>
          </select>
        </div>
        <div class="row"><label>附加</label>
          <select id="s_extra">
            <option value="none">none 无</option>
            <option value="dots">dots ...</option>
            <option value="z">z</option>
            <option value="tears">tears 泪滴</option>
            <option value="hearts">hearts 飘心</option>
            <option value="blush">blush 腮红</option>
            <option value="glasses">glasses 墨镜</option>
          </select>
        </div>
        <div class="row"><label>抖动</label><input type="checkbox" id="s_shake"></div>
      </div>
    </div>

    <div class="btns">
      <button onclick="saveRecipe()">保存完整配方到板子</button>
      <button class="green" onclick="testState()">试灯</button>
      <button class="gray" onclick="toIdle()">回 idle</button>
      <button class="red" onclick="delState()">删除状态</button>
    </div>
    <div class="msg" id="msg1"></div>
  </div>

  <!-- ═══════════ 页签二：事件绑定 ═══════════ -->
  <div class="panel" id="tab_bind" style="display:none">
    <h2>事件 → 状态 绑定规则</h2>
    <div class="hint" style="margin-bottom:12px">
      数组顺序即匹配顺序（从上到下第一条命中生效）。字段：来源 / 事件名 / 工具通配符（如 Bash*）/
      附加条件（事件里的字段=值）/ 仅出错时。状态下拉来自板子配方库。
      <br>例：Codex 回合完成 → done；Claude 请求授权 → waiting。
    </div>
    <div class="btns" style="margin:0 0 12px">
      <button onclick="addRule()">＋新增规则</button>
      <button class="green" onclick="saveRules()">保存并热加载</button>
      <button class="gray" onclick="loadAll()">重新载入</button>
    </div>
    <div id="ruleList"></div>

    <h3>状态优先级（数值越大越优先插队）</h3>
    <div id="prioRows"></div>

    <h3>超时（秒）</h3>
    <div class="row"><label>done 停留</label><input type="number" id="t_done" value="5" min="0" style="width:80px"></div>
    <div class="row"><label>会话超时</label><input type="number" id="t_session" value="90" min="10" style="width:80px"></div>
    <div class="row"><label>心跳间隔</label><input type="number" id="t_heartbeat" value="20" min="5" style="width:80px"></div>

    <div class="btns">
      <button class="green" onclick="saveRules()">保存全部并热加载</button>
    </div>
    <div class="msg" id="msg2"></div>
  </div>

<script>
'use strict';
let boardIp = localStorage.getItem('ap_ip') || '';
let states = {};   // 板子上的配方：name -> {led:{...}, screen:{...}}
let selected = null;
let isNew = false;
let rules = [];    // 绑定规则数组
let cfg = { priority: {}, done_hold: 5, session_timeout: 90, heartbeat: 20 };
let stateNames = ['idle', 'thinking', 'reading', 'writing', 'shell', 'waiting', 'done', 'error'];

const $ = id => document.getElementById(id);
$('ip').value = boardIp;

function msg(id, text, ok) {
  const el = $(id);
  el.textContent = text;
  el.className = 'msg ' + (ok ? 'ok' : 'err');
}

async function board(path, opts) {
  const r = await fetch('http://' + boardIp + path, opts);
  const t = await r.text();
  let j = null; try { j = JSON.parse(t); } catch (e) {}
  return { ok: r.ok, j, t };
}

// ── 连接与总加载 ──
async function connectBoard() {
  boardIp = $('ip').value.trim();
  if (!boardIp) {
    try {
      const h = await (await fetch('/health')).json();
      if (h.device && h.device.indexOf('.') > 0) { boardIp = h.device; $('ip').value = boardIp; }
    } catch (e) {}
  }
  if (!boardIp) { msg('msg1', '请先填板子 IP', false); return; }
  localStorage.setItem('ap_ip', boardIp);
  const r = await board('/api/v1/states');
  if (!r.ok) { msg('msg1', '连接失败：' + r.t.slice(0, 60), false); return; }
  states = r.j.states;
  stateNames = Array.from(new Set(stateNames.concat(Object.keys(states))));
  renderChips();
  select(Object.keys(states).sort()[0] || 'idle');
  msg('msg1', '已连接 ' + boardIp + '，共 ' + Object.keys(states).length + ' 个状态', true);
}

async function loadAll() {
  await connectBoard();
  try {
    const m = await (await fetch('/api/v1/mapping')).json();
    rules = m.rules || [];
    cfg = { done_hold: 5, session_timeout: 90, heartbeat: 20 };
    if (m.priority) cfg.priority = Object.assign({}, cfg.priority, m.priority);
    if (m.timeouts) Object.assign(cfg, m.timeouts);
    renderRules();
    renderPriority();
    $('t_done').value = cfg.done_hold;
    $('t_session').value = cfg.session_timeout;
    $('t_heartbeat').value = cfg.heartbeat;
    msg('msg2', '已载入 ' + rules.length + ' 条规则', true);
  } catch (e) { msg('msg2', 'mapping 载入失败', false); }
}

// ── 配方编辑 ──
function renderChips() {
  const box = $('stateChips');
  box.innerHTML = '';
  Object.keys(states).sort().forEach(function (n) {
    const d = document.createElement('div');
    d.className = 'chip' + (n === selected ? ' sel' : '');
    const c = states[n].led ? states[n].led.color : '#888';
    d.innerHTML = '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:' + c + ';margin-right:6px"></span>' + n;
    d.onclick = function () { select(n); };
    box.appendChild(d);
  });
}

const SCREEN_DEFAULTS = {
  idle:    { bg: '#000000', fg: '#646E7D', eye: 'sleep', anim: 'still', mouth: 'none',     extra: 'z',    shake: false },
  thinking:{ bg: '#000000', fg: '#9D8FFF', eye: 'open',  anim: 'look',  mouth: 'flat',    extra: 'dots', shake: false },
  reading: { bg: '#000000', fg: '#5AA2F0', eye: 'open',  anim: 'scan',  mouth: 'flat',    extra: 'none', shake: false },
  writing: { bg: '#000000', fg: '#4FCF84', eye: 'open',  anim: 'down',  mouth: 'o',       extra: 'none', shake: false },
  shell:   { bg: '#000000', fg: '#3BB8E8', eye: 'open',  anim: 'still', mouth: 'prompt',  extra: 'none', shake: false },
  waiting: { bg: '#000000', fg: '#FFB03A', eye: 'wide',  anim: 'still', mouth: 'question',extra: 'none', shake: false },
  done:    { bg: '#000000', fg: '#3BD692', eye: 'happy', anim: 'still', mouth: 'smile',   extra: 'none', shake: false },
  error:   { bg: '#000000', fg: '#F04848', eye: 'x',     anim: 'still', mouth: 'wave',    extra: 'none', shake: true  },
  angry:   { bg: '#000000', fg: '#FF8C42', eye: 'angry',  anim: 'still', mouth: 'frown',   extra: 'none', shake: false },
  love:    { bg: '#000000', fg: '#FF6B9D', eye: 'heart',  anim: 'still', mouth: 'smile',   extra: 'hearts', shake: false },
  cry:     { bg: '#000000', fg: '#5B8DEF', eye: 'sleep',  anim: 'still', mouth: 'frown',   extra: 'tears', shake: false },
  dizzy:   { bg: '#000000', fg: '#B08BE8', eye: 'spiral', anim: 'still', mouth: 'wave',    extra: 'none', shake: false },
  cool:    { bg: '#000000', fg: '#38E0C8', eye: 'open',   anim: 'still', mouth: 'smile',   extra: 'glasses', shake: false },
  shy:     { bg: '#000000', fg: '#FF9EB5', eye: 'happy',  anim: 'still', mouth: 'o',       extra: 'blush', shake: false },
  tongue:  { bg: '#000000', fg: '#FFD93D', eye: 'open',   anim: 'still', mouth: 'tongue',  extra: 'none', shake: false },
  shock:   { bg: '#000000', fg: '#7FD4FF', eye: 'wide',   anim: 'still', mouth: 'o',       extra: 'none', shake: false },
};
const CUSTOM_DEFAULT = { bg: '#000000', fg: '#8C9BAB', eye: 'open', anim: 'still', mouth: 'flat', extra: 'none', shake: false };

function select(name) {
  selected = name; isNew = false;
  const r = states[name] || {};
  $('f_name').value = name;
  $('f_name').disabled = !isNew;
  $('f_color').value = (r.led && r.led.color) || '#3BB8E8';
  $('f_mode').value = (r.led && r.led.mode) || 'steady';
  $('f_period').value = (r.led && r.led.period) || 800;
  $('f_pv').textContent = $('f_period').value + 'ms';
  const s = r.screen || SCREEN_DEFAULTS[name] || CUSTOM_DEFAULT;
  $('s_bg').value = s.bg || '#000000';
  $('s_fg').value = s.fg || '#8C9BAB';
  $('s_eye').value = s.eye || 'open';
  $('s_anim').value = s.anim || 'still';
  $('s_mouth').value = s.mouth || 'flat';
  $('s_extra').value = s.extra || 'none';
  $('s_shake').checked = !!s.shake;
  renderChips();
}

function newRecipe() {
  isNew = true; selected = '';
  $('f_name').value = ''; $('f_name').disabled = false;
  $('f_color').value = '#3BB8E8'; $('f_mode').value = 'breath'; $('f_period').value = 1500;
  $('s_bg').value = '#000000'; $('s_fg').value = '#3BB8E8';
  $('s_eye').value = 'open'; $('s_anim').value = 'still';
  $('s_mouth').value = 'flat'; $('s_extra').value = 'none'; $('s_shake').checked = false;
  renderChips();
  msg('msg1', '填写名字与外观后保存', true);
}

function collectRecipe() {
  return {
    led: {
      color: $('f_color').value,
      mode: $('f_mode').value,
      period: parseInt($('f_period').value, 10),
    },
    screen: {
      bg: $('s_bg').value, fg: $('s_fg').value,
      eye: $('s_eye').value, anim: $('s_anim').value,
      mouth: $('s_mouth').value, extra: $('s_extra').value,
      shake: $('s_shake').checked,
    },
  };
}

async function saveRecipe() {
  const name = $('f_name').value.trim();
  if (!/^[a-zA-Z0-9_]{1,12}$/.test(name)) { msg('msg1', '名字须为 1~12 位字母/数字/下划线', false); return; }
  const r = await board('/api/v1/states/' + name, {
    method: 'PUT', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(collectRecipe()),
  });
  msg('msg1', r.ok ? '完整配方已保存到板子 ✓' : '失败: ' + (r.j ? r.j.error : r.t.slice(0, 60)), r.ok);
  if (r.ok) {
    isNew = false; $('f_name').disabled = true;
    await connectBoard(); select(name);
  }
}

async function delState() {
  if (!selected) return;
  if (!confirm('删除状态 ' + selected + '？')) return;
  await board('/api/v1/states/' + selected, { method: 'DELETE' });
  delete states[selected]; selected = null;
  await connectBoard();
  msg('msg1', '已删除', true);
}

async function testState() {
  const name = $('f_name').value.trim();
  if (!states[name]) { msg('msg1', '该状态尚未保存，请先保存再试灯', false); return; }
  const r = await board('/api/v1/state', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ state: name, source: 'ui' }),
  });
  msg('msg1', r.ok ? '已切换（最多保持 20 秒，心跳会拉回真实状态）' : '切换失败', r.ok);
}

async function toIdle() {
  await board('/api/v1/state', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ state: 'idle' }),
  });
  msg('msg1', '已回 idle', true);
}

// ── 事件绑定规则编辑 ──
function stateOptions(sel) {
  return stateNames.map(function (n) {
    return '<option value="' + n + '"' + (n === sel ? ' selected' : '') + '>' + n + '</option>';
  }).join('');
}

function renderRules() {
  const box = $('ruleList');
  if (!rules.length) { box.innerHTML = '<div class="hint">（还没有规则，点"新增规则"）</div>'; return; }
  box.innerHTML = rules.map(function (r, i) {
    return '<div class="rulecard">'
      + '<div class="head"><span class="idx">规则 #' + (i + 1) + '</span>'
      + '<span>'
      + '<button class="small gray" onclick="moveRule(' + i + ',-1)">↑</button> '
      + '<button class="small gray" onclick="moveRule(' + i + ',1)">↓</button> '
      + '<button class="small red" onclick="delRule(' + i + ')">删除</button>'
      + '</span></div>'
      + '<div class="rulegrid">'
      + '<div class="f"><span>来源</span><select data-i="' + i + '" data-k="source">'
      + '<option value="">任意</option>'
      + '<option value="claude"' + (r.source === 'claude' ? ' selected' : '') + '>claude</option>'
      + '<option value="codex"' + (r.source === 'codex' ? ' selected' : '') + '>codex</option>'
      + '</select></div>'
      + '<div class="f"><span>状态→</span><select data-i="' + i + '" data-k="state">'
      + stateOptions(r.state) + '</select></div>'
      + '<div class="f"><span>事件名</span><input data-i="' + i + '" data-k="event" value="'
      + (r.event || r.type || '') + '" placeholder="如 PreToolUse / agent-turn-complete"></div>'
      + '<div class="f"><span>工具</span><input data-i="' + i + '" data-k="tool" value="'
      + (r.tool || '') + '" placeholder="通配符，如 Bash*"></div>'
      + '<div class="f"><span>优先级</span><input type="number" data-i="' + i + '" data-k="priority" value="'
      + (r.priority != null ? r.priority : '') + '" placeholder="默认"></div>'
      + '<div class="f"><span>标签</span><input data-i="' + i + '" data-k="label" value="'
      + (r.label || '') + '" placeholder="可空"></div>'
      + '<div class="f"><span>条件</span><input data-i="' + i + '" data-k="whenKey" value="'
      + (r.whenKey || '') + '" placeholder="字段名，如 message"></div>'
      + '<div class="f"><span>等于</span><input data-i="' + i + '" data-k="whenValue" value="'
      + (r.whenValue != null ? r.whenValue : '') + '" placeholder="字段值"></div>'
      + '<div class="f"><span>仅出错</span><input type="checkbox" data-i="' + i + '" data-k="on_error"'
      + (r.on_error ? ' checked' : '') + '></div>'
      + '</div></div>';
  }).join('');
}

function readRuleCard(i) {
  const out = { state: 'idle' };
  document.querySelectorAll('[data-i="' + i + '"]').forEach(function (el) {
    const k = el.dataset.k;
    let v = el.type === 'checkbox' ? el.checked : el.value;
    if (v === '' || v == null) return;
    if (k === 'priority') v = parseInt(v, 10);
    if (k === 'whenValue' && /^-?\d+(\.\d+)?$/.test(String(v))) v = Number(v);
    if (k === 'whenKey') { if (v) out.whenKey = v; return; }
    if (k === 'whenValue') { if (v !== '' && out.whenKey) out['when'] = JSON.parse('{"' + out.whenKey + '": ' + JSON.stringify(v) + '}'); return; }
    out[k] = v;
  });
  return out;
}

function addRule() {
  collectRuleCards();  // 先保存当前卡片内容
  rules.push({ state: stateNames[0] });
  renderRules();
}

function moveRule(i, d) {
  collectRuleCards();
  const j = i + d;
  if (j < 0 || j >= rules.length) return;
  const t = rules[i]; rules[i] = rules[j]; rules[j] = t;
  renderRules();
}

function delRule(i) {
  collectRuleCards();
  rules.splice(i, 1);
  renderRules();
}

function collectRuleCards() {
  rules = rules.map(function (_, i) { return readRuleCard(i); });
}

async function saveRules() {
  collectRuleCards();
  const payload = {
    rules: rules,
    priority: {},
    timeouts: {
      done_hold: parseFloat($('t_done').value) || 5,
      session: parseFloat($('t_session').value) || 90,
      heartbeat: parseFloat($('t_heartbeat').value) || 20,
    },
  };
  document.querySelectorAll('#prioRows input').forEach(function (el) {
    payload.priority[el.dataset.state] = parseInt(el.value, 10) || 0;
  });
  try {
    const r = await fetch('/api/v1/mapping', {
      method: 'PUT', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload),
    });
    msg('msg2', r.ok ? '已保存并热加载 ✓' : '保存失败', r.ok);
  } catch (e) { msg('msg2', '保存失败', false); }
}

function renderPriority() {
  const box = $('prioRows');
  const names = Array.from(new Set(stateNames.concat(Object.keys(cfg.priority))));
  box.innerHTML = names.map(function (n) {
    const c = (states[n] && states[n].led && states[n].led.color) || '#666';
    const v = cfg.priority[n] != null ? cfg.priority[n] : 0;
    return '<div class="prioRow"><span class="dot" style="background:' + c + '"></span>'
      + '<span class="nm">' + n + '</span>'
      + '<input type="number" data-state="' + n + '" value="' + v + '"></div>';
  }).join('');
}

// ── LED 预览：与固件同一套算法 ──
function ledLevel(mode, period, t) {
  const tt = t % period;
  if (mode === 'steady') return 1;
  if (mode === 'breath') { const n = 0.5 - 0.5 * Math.cos(tt * 2 * Math.PI / period); return n * n; }
  if (mode === 'blink') return tt < period / 2 ? 1 : 0;
  if (mode === 'double') return (tt < 120 || (tt >= 240 && tt < 360)) ? 1 : 0;
  return 0;
}

function previewLoop() {
  const el = $('ledPreview');
  const color = $('f_color').value;
  const mode = $('f_mode').value;
  let period = parseInt($('f_period').value, 10);
  if (mode === 'steady' || !period) period = 1000;
  const level = ledLevel(mode, period, performance.now());
  el.style.background = color;
  el.style.opacity = (0.12 + 0.88 * level).toFixed(3);
  el.style.boxShadow = '0 0 ' + Math.round(24 * level) + 'px ' + color;
  requestAnimationFrame(previewLoop);
}
requestAnimationFrame(previewLoop);

// ── 屏幕预览：与固件/模拟器同一套几何参数 ──
const sc2 = $('screen').getContext('2d');
sc2.scale(2, 2);

function drawScreen(t) {
  const p = {
    bg: $('s_bg').value, fg: $('s_fg').value,
    eye: $('s_eye').value, anim: $('s_anim').value,
    mouth: $('s_mouth').value, extra: $('s_extra').value,
    shake: $('s_shake').checked,
  };
  sc2.fillStyle = p.bg;
  sc2.fillRect(0, 0, 240, 240);

  let ox = 0, oy = 0;
  if (p.shake) { ox = Math.sin(t * 28) * 2; oy = Math.cos(t * 33) * 1.5; }
  sc2.save();
  sc2.translate(ox, oy);
  sc2.textAlign = 'center';
  sc2.textBaseline = 'middle';

  const lx = 120 - 38, rx = 120 + 38, ey = 96, my = 156;
  const blink = ((t + 1.3) % 3.6) < 0.12;

  function eyeOpen(x, y, r) {
    sc2.fillStyle = p.fg;
    sc2.beginPath(); sc2.arc(x, y, r, 0, 6.2832); sc2.fill();
    sc2.fillStyle = 'rgba(255,255,255,.85)';
    sc2.beginPath(); sc2.arc(x - r * 0.3, y - r * 0.35 - 1, r * 0.28, 0, 6.2832); sc2.fill();
  }
  function eyeArc(x, y, up) {
    sc2.strokeStyle = p.fg; sc2.lineWidth = 9; sc2.lineCap = 'round';
    sc2.beginPath();
    if (up) sc2.arc(x, y + 8, 16, Math.PI * 1.12, Math.PI * 1.88);
    else    sc2.arc(x, y - 6, 16, Math.PI * 0.15, Math.PI * 0.85);
    sc2.stroke();
  }
  function eyeLine(x, y) {
    sc2.strokeStyle = p.fg; sc2.lineWidth = 9; sc2.lineCap = 'round';
    sc2.beginPath(); sc2.moveTo(x - 10, y); sc2.lineTo(x + 10, y); sc2.stroke();
  }
  function eyeX(x, y) {
    sc2.strokeStyle = p.fg; sc2.lineWidth = 9; sc2.lineCap = 'round';
    sc2.beginPath();
    sc2.moveTo(x - 11, y - 11); sc2.lineTo(x + 11, y + 11);
    sc2.moveTo(x + 11, y - 11); sc2.lineTo(x - 11, y + 11);
    sc2.stroke();
  }
  function drawHeart(x, y, s) {
    sc2.beginPath();
    sc2.arc(x - s * 0.5, y - s * 0.3, s * 0.5, 0, Math.PI * 2);
    sc2.arc(x + s * 0.5, y - s * 0.3, s * 0.5, 0, Math.PI * 2);
    sc2.fill();
    sc2.beginPath();
    sc2.moveTo(x - s * 0.95, y - s * 0.02);
    sc2.lineTo(x + s * 0.95, y - s * 0.02);
    sc2.lineTo(x, y + s * 0.8);
    sc2.closePath(); sc2.fill();
  }
  function eyeHeart(x, y) { drawHeart(x, y, 14); }
  function eyeSpiral(x, y) {
    sc2.beginPath();
    for (let a = 0; a <= 720; a += 14) {
      const rad = a * Math.PI / 180, rr = 2 + (a / 720) * 12;
      const px = x + Math.cos(rad) * rr, py = y + Math.sin(rad) * rr;
      if (a === 0) sc2.moveTo(px, py); else sc2.lineTo(px, py);
    }
    sc2.lineWidth = 3.5; sc2.stroke();
  }
  function browAngry(x, y, left) {
    sc2.beginPath();
    if (left) { sc2.moveTo(x - 12, y - 24); sc2.lineTo(x + 10, y - 15); }
    else { sc2.moveTo(x + 12, y - 24); sc2.lineTo(x - 10, y - 15); }
    sc2.lineWidth = 8; sc2.stroke();
  }

  if (p.eye === 'sleep') { eyeArc(lx, ey, false); eyeArc(rx, ey, false); }
  else if (p.eye === 'happy') { eyeArc(lx, ey, true); eyeArc(rx, ey, true); }
  else if (p.eye === 'x') { eyeX(lx, ey); eyeX(rx, ey); }
  else if (p.eye === 'heart') { eyeHeart(lx, ey); eyeHeart(rx, ey); }
  else if (p.eye === 'spiral') { eyeSpiral(lx, ey); eyeSpiral(rx, ey); }
  else if (p.eye === 'angry') {
    if (blink) { eyeLine(lx, ey); eyeLine(rx, ey); }
    else { eyeOpen(lx, ey, 14); eyeOpen(rx, ey, 14); }
    browAngry(lx, ey, true); browAngry(rx, ey, false);
  }
  else {
    const r = p.eye === 'wide' ? 16.5 : 14;
    let dx = 0, dy = 0;
    if (p.anim === 'look') { dx = Math.sin(t * 0.7) * 6 - 2; dy = -6; }
    if (p.anim === 'scan') { dx = Math.sin(t * 2.4) * 8; dy = 3; }
    if (p.anim === 'down') { dy = 5; }
    if (blink) { eyeLine(lx, ey); eyeLine(rx, ey); }
    else { eyeOpen(lx + dx, ey + dy, r); eyeOpen(rx + dx, ey + dy, r); }
  }

  sc2.strokeStyle = p.fg; sc2.fillStyle = p.fg; sc2.lineWidth = 9; sc2.lineCap = 'round';
  switch (p.mouth) {
    case 'flat':
      sc2.beginPath(); sc2.moveTo(98, my); sc2.lineTo(142, my); sc2.stroke(); break;
    case 'smile':
      sc2.beginPath(); sc2.arc(120, my - 10, 26, Math.PI * 0.12, Math.PI * 0.88); sc2.stroke(); break;
    case 'o':
      sc2.beginPath(); sc2.arc(120, my, 9, 0, Math.PI * 2); sc2.fill(); break;
    case 'wave':
      sc2.beginPath();
      sc2.moveTo(96, my);
      sc2.quadraticCurveTo(108, my - 10, 120, my);
      sc2.quadraticCurveTo(132, my + 10, 144, my);
      sc2.stroke(); break;
    case 'frown':
      sc2.beginPath(); sc2.arc(120, my + 12, 16, Math.PI * 1.14, Math.PI * 1.86); sc2.stroke(); break;
    case 'tongue':
      sc2.beginPath(); sc2.arc(120, my - 10, 26, Math.PI * 0.12, Math.PI * 0.88); sc2.stroke();
      sc2.fillStyle = '#FF6B9D';
      sc2.beginPath();
      sc2.moveTo(112, my + 2); sc2.lineTo(128, my + 2);
      sc2.quadraticCurveTo(126, my + 16, 120, my + 16);
      sc2.quadraticCurveTo(114, my + 16, 112, my + 2);
      sc2.fill(); break;
    case 'prompt':
      sc2.font = 'bold 26px Menlo, monospace';
      sc2.fillText((t % 1) < 0.55 ? '> _' : '>  ', 120, my - 2); break;
    case 'question':
      sc2.font = 'bold 34px sans-serif';
      sc2.fillText('?', 120, my - 2 + Math.sin(t * 3) * 3); break;
  }

  if (p.extra === 'dots') {
    for (let i = 0; i < 3; i++) {
      sc2.globalAlpha = Math.sin(t * 2.4 - i * 0.7) > -0.2 ? 1 : 0.25;
      sc2.beginPath(); sc2.arc(178 + i * 14, 40, 4.5, 0, Math.PI * 2); sc2.fill();
    }
    sc2.globalAlpha = 1;
  } else if (p.extra === 'z') {
    sc2.globalAlpha = 0.35 + 0.45 * Math.abs(Math.sin(t * 1.4));
    sc2.fillStyle = p.fg;
    sc2.font = 'bold 20px sans-serif';
    sc2.fillText('z', 196, 44);
    sc2.globalAlpha = 1;
  } else if (p.extra === 'tears') {
    for (let i = 0; i < 2; i++) {
      const ex = i === 0 ? lx : rx;
      const yy = ey + 14 + ((t * 30 + i * 22) % 45);
      sc2.fillStyle = '#7EC8FF';
      sc2.beginPath(); sc2.arc(ex, yy, 3.5, 0, Math.PI * 2); sc2.fill();
    }
  } else if (p.extra === 'hearts') {
    for (let i = 0; i < 2; i++) {
      const a = Math.sin(t * 1.8 + i * 2.2);
      drawHeart(60 + i * 120, 44 - a * 8, 8 + a * 2);
    }
  } else if (p.extra === 'blush') {
    sc2.fillStyle = '#F79EB5';
    sc2.beginPath(); sc2.arc(78, 118, 7, 0, Math.PI * 2); sc2.fill();
    sc2.beginPath(); sc2.arc(162, 118, 7, 0, Math.PI * 2); sc2.fill();
  } else if (p.extra === 'glasses') {
    sc2.fillStyle = '#10151C';
    sc2.fillRect(lx - 17, ey - 11, 34, 22);
    sc2.fillRect(rx - 17, ey - 11, 34, 22);
    sc2.strokeStyle = p.fg; sc2.lineWidth = 3;
    sc2.strokeRect(lx - 17, ey - 11, 34, 22);
    sc2.strokeRect(rx - 17, ey - 11, 34, 22);
    sc2.beginPath(); sc2.moveTo(lx + 17, ey - 6); sc2.lineTo(rx - 17, ey - 6); sc2.stroke();
  }
  sc2.restore();
}

let lastScreenDraw = 0;
function screenLoop(ms) {
  if (ms - lastScreenDraw > 33) { lastScreenDraw = ms; drawScreen(ms / 1000); }
  requestAnimationFrame(screenLoop);
}
requestAnimationFrame(screenLoop);

// ── 页签 ──
function showTab(name) {
  $('tab_recipe').style.display = name === 'recipe' ? '' : 'none';
  $('tab_bind').style.display = name === 'bind' ? '' : 'none';
  $('tabbtn_recipe').className = name === 'recipe' ? 'on' : '';
  $('tabbtn_bind').className = name === 'bind' ? 'on' : '';
}

// ── 启动 ──
connectBoard().then(function () {
  loadAll();
});
if (location.hash === '#bind') showTab('bind');
</script>

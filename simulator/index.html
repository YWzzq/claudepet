<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentPet V0 · 240×240 表情模拟器</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 16px 48px;
    background: #12141A; color: #E5E7EB;
    font-family: -apple-system, "Hiragino Sans GB", "PingFang SC", sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
  }
  h1 { font-size: 20px; font-weight: 700; margin: 0; }
  .sub { font-size: 13px; color: #9CA3AF; margin-top: -12px; }
  canvas {
    width: 480px; height: 480px; max-width: 92vw; max-height: 92vw;
    border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,.5);
  }
  .payload {
    font-family: ui-monospace, Menlo, monospace; font-size: 12px;
    color: #93C5FD; background: #1E2430; padding: 8px 14px;
    border-radius: 8px; max-width: 92vw; overflow-x: auto; white-space: nowrap;
  }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 640px; }
  .controls button {
    padding: 7px 13px; border-radius: 8px; cursor: pointer;
    border: 1.5px solid transparent; font-size: 13px;
    background: #374151; color: #F9FAFB;
  }
  .controls button.active { border-color: #fff; transform: translateY(-1px); }
  .extras { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; justify-content: center; font-size: 13px; }
  .extras input[type=text] {
    background: #1F2937; border: 1px solid #374151; color: #E5E7EB;
    border-radius: 6px; padding: 6px 10px; width: 150px;
  }
  .extras select {
    background: #1F2937; border: 1px solid #374151; color: #E5E7EB;
    border-radius: 6px; padding: 6px 8px;
  }
  .hint { font-size: 12px; color: #6B7280; max-width: 560px; text-align: center; line-height: 1.7; }
</style>
</head>
<body>
  <h1>AgentPet V0 · 表情模拟器</h1>
  <div class="sub">黑底 = 屏幕不显示；亮起来的只有彩色大五官，简单直白</div>
  <canvas id="pet" width="480" height="480"></canvas>
  <div class="payload" id="payload"></div>
  <div class="controls" id="controls"></div>
  <div class="extras">
    <label><input type="checkbox" id="auto" checked> 自动轮播（3s）</label>
    <span>label <input type="text" id="label" placeholder="如 Edit / Bash"></span>
    <span>source
      <select id="source"><option>claude</option><option>codex</option></select>
    </span>
  </div>
  <p class="hint">
    设计原则：正常背景就是黑色（相当于屏幕没亮），状态只靠彩色大五官表达，
    一眼看懂，不做复杂道具。固件（V0.4 起）按同一套参数用 Adafruit GFX 复现。
  </p>

<script>
'use strict';

// ── 状态定义（与 firmware/src/pet_state.h 一一对应）──
// 黑色底 = 屏幕不显示；fg = 亮起来的五官颜色
const ORDER = ['idle', 'thinking', 'reading', 'writing', 'shell', 'waiting', 'done', 'error'];
const STATES = {
  idle:     { zh: '空闲',     fg: '#8C9BAB' },
  thinking: { zh: '思考',     fg: '#9D8FFF' },
  reading:  { zh: '读代码',   fg: '#5AA2F0' },
  writing:  { zh: '写代码',   fg: '#4FCF84' },
  shell:    { zh: '执行命令', fg: '#3BB8E8' },
  waiting:  { zh: '等待确认', fg: '#FFB03A' },
  done:     { zh: '完成',     fg: '#3BD692' },
  error:    { zh: '异常',     fg: '#F04848' },
};
let INK = '#FFFFFF';                   // 五官颜色，随状态切换（黑底彩五官）
const EYE_Y = 96, EYE_DX = 38;         // 眼睛：y=96，左右各偏 38 → x=82 / 158
const EYE_R = 14;                      // 眼睛半径
const MOUTH_Y = 156;                   // 嘴的纵向位置
const LW = 9;                          // 五官线条粗细

const canvas = document.getElementById('pet');
const ctx = canvas.getContext('2d');
ctx.scale(2, 2);  // 内部 480 实际像素，按 240 逻辑坐标绘制

let current = 'idle';

// ── 基础元素 ──
function eyeOpen(x, y, r) {
  ctx.fillStyle = INK;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.beginPath();
  ctx.arc(x - r * 0.3, y - r * 0.35, r * 0.28, 0, Math.PI * 2);
  ctx.fill();
}

function eyeLine(x, y) {   // 眨眼瞬间：一条短横线
  ctx.strokeStyle = INK;
  ctx.lineWidth = LW;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x - 10, y); ctx.lineTo(x + 10, y);
  ctx.stroke();
}

function eyeSleep(x, y) {  // 闭眼睡觉 "∪"
  ctx.strokeStyle = INK;
  ctx.lineWidth = LW;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(x, y - 6, 16, Math.PI * 0.15, Math.PI * 0.85);
  ctx.stroke();
}

function eyeHappy(x, y) {  // 开心眯眼 "∩"
  ctx.strokeStyle = INK;
  ctx.lineWidth = LW;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(x, y + 8, 16, Math.PI * 1.12, Math.PI * 1.88);
  ctx.stroke();
}

function eyeX(x, y) {      // X 眼
  ctx.strokeStyle = INK;
  ctx.lineWidth = LW;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x - 11, y - 11); ctx.lineTo(x + 11, y + 11);
  ctx.moveTo(x + 11, y - 11); ctx.lineTo(x - 11, y + 11);
  ctx.stroke();
}

function mouthFlat() {
  ctx.strokeStyle = INK;
  ctx.lineWidth = LW;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(120 - 22, MOUTH_Y); ctx.lineTo(120 + 22, MOUTH_Y);
  ctx.stroke();
}

function mouthSmile() {
  ctx.strokeStyle = INK;
  ctx.lineWidth = LW;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(120, MOUTH_Y - 10, 26, Math.PI * 0.12, Math.PI * 0.88);
  ctx.stroke();
}

function mouthWave() {     // 难受/宕机的波浪嘴
  ctx.strokeStyle = INK;
  ctx.lineWidth = LW - 1;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(96, MOUTH_Y);
  ctx.quadraticCurveTo(108, MOUTH_Y - 10, 120, MOUTH_Y);
  ctx.quadraticCurveTo(132, MOUTH_Y + 10, 144, MOUTH_Y);
  ctx.stroke();
}

function mouthO() {
  ctx.fillStyle = INK;
  ctx.beginPath();
  ctx.arc(120, MOUTH_Y, 9, 0, Math.PI * 2);
  ctx.fill();
}

function isBlinking(t) {
  return ((t + 1.3) % 3.6) < 0.12;
}

// ── 主绘制 ──
function draw(t) {
  const s = STATES[current];
  ctx.clearRect(0, 0, 240, 240);

  // error 整屏轻微抖动
  let ox = 0, oy = 0;
  if (current === 'error') {
    ox = Math.sin(t * 28) * 2;
    oy = Math.cos(t * 33) * 1.5;
  }
  ctx.save();
  ctx.translate(ox, oy);

  // 黑底 = 屏幕不显示，只有五官亮起
  ctx.fillStyle = '#000000';
  ctx.fillRect(-4, -4, 248, 248);
  INK = s.fg;

  ctx.save();
  ctx.translate(0, 0);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // ── 眼睛 ──
  const lx = 120 - EYE_DX, rx = 120 + EYE_DX;
  switch (current) {
    case 'idle':
      eyeSleep(lx, EYE_Y);
      eyeSleep(rx, EYE_Y);
      break;
    case 'thinking': {
      const look = { x: Math.sin(t * 0.7) * 6 - 2, y: -6 };
      eyeOpen(lx + look.x, EYE_Y + look.y, EYE_R);
      eyeOpen(rx + look.x, EYE_Y + look.y, EYE_R);
      break;
    }
    case 'reading': {
      const dx = Math.sin(t * 2.4) * 8;
      eyeOpen(lx + dx, EYE_Y + 3, EYE_R - 1);
      eyeOpen(rx + dx, EYE_Y + 3, EYE_R - 1);
      break;
    }
    case 'writing':
      eyeOpen(lx, EYE_Y + 5, EYE_R - 1);
      eyeOpen(rx, EYE_Y + 5, EYE_R - 1);
      break;
    case 'shell':
    case 'waiting':
    case 'done':
    case 'error':
      break;  // 下面单独处理
  }

  if (current === 'shell' || current === 'waiting') {
    const r = current === 'waiting' ? EYE_R + 4 : EYE_R;
    if (isBlinking(t)) {
      eyeLine(lx, EYE_Y); eyeLine(rx, EYE_Y);
    } else {
      eyeOpen(lx, EYE_Y, r);
      eyeOpen(rx, EYE_Y, r);
    }
  } else if (current === 'done') {
    eyeHappy(lx, EYE_Y);
    eyeHappy(rx, EYE_Y);
  } else if (current === 'error') {
    eyeX(lx, EYE_Y);
    eyeX(rx, EYE_Y);
  }

  // ── 嘴 ──
  switch (current) {
    case 'idle':     /* 睡觉没嘴 */ break;
    case 'thinking': mouthFlat(); break;
    case 'reading':  mouthFlat(); break;
    case 'writing':  mouthO();    break;
    case 'shell':    // 嘴就是命令行提示符
      ctx.fillStyle = INK;
      ctx.font = 'bold 26px Menlo, monospace';
      ctx.fillText('> _'.replace('_', (t % 1) < 0.55 ? '_' : ' '), 120, MOUTH_Y);
      break;
    case 'waiting':  // 嘴就是问号
      ctx.fillStyle = INK;
      ctx.font = 'bold 34px sans-serif';
      ctx.fillText('?', 120, MOUTH_Y + Math.sin(t * 3) * 3);
      break;
    case 'done':     mouthSmile(); break;
    case 'error':    mouthWave(); break;
  }

  // ── 极简提示（只有两个状态有）──
  if (current === 'idle') {
    // 一个飘着的 z
    ctx.globalAlpha = 0.35 + 0.45 * Math.abs(Math.sin(t * 1.4));
    ctx.fillStyle = INK;
    ctx.font = 'bold 20px sans-serif';
    ctx.fillText('z', 196, 44);
    ctx.globalAlpha = 1;
  } else if (current === 'thinking') {
    // 右上角 "...",依次点亮
    ctx.fillStyle = INK;
    for (let i = 0; i < 3; i++) {
      const on = Math.sin(t * 2.4 - i * 0.7) > -0.2;
      ctx.globalAlpha = on ? 1 : 0.25;
      ctx.beginPath();
      ctx.arc(178 + i * 14, 40, 4.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  ctx.restore();
  ctx.restore();
}

// ── UI ──
const labelEl = document.getElementById('label');
const sourceEl = document.getElementById('source');
const payloadEl = document.getElementById('payload');
const controlsEl = document.getElementById('controls');
const autoEl = document.getElementById('auto');

function updatePayload() {
  const body = {
    source: sourceEl.value,
    state: current,
    label: labelEl.value || STATES[current].zh,
    session_id: 'sim-1',
  };
  payloadEl.textContent = 'POST /api/v1/state   ' + JSON.stringify(body);
}

function setState(name) {
  current = name;
  Array.prototype.forEach.call(controlsEl.children, function (b) {
    b.classList.toggle('active', b.dataset.state === name);
  });
  updatePayload();
}

ORDER.forEach(function (name) {
  const b = document.createElement('button');
  b.dataset.state = name;
  b.textContent = name + ' · ' + STATES[name].zh;
  b.style.background = STATES[name].fg;
  b.style.color = '#111';
  b.addEventListener('click', function () { setState(name); });
  controlsEl.appendChild(b);
});

labelEl.addEventListener('input', updatePayload);
sourceEl.addEventListener('change', updatePayload);

setInterval(function () {
  if (!autoEl.checked) return;
  setState(ORDER[(ORDER.indexOf(current) + 1) % ORDER.length]);
}, 3000);

setState('idle');

function loop(ms) {
  draw(ms / 1000);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>

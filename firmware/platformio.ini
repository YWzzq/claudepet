; AgentPet — ESP32-S3-N16R8 (16MB Flash + 8MB Octal PSRAM)
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3

; 仿真演示固件：每 6 秒自动轮流展示 8 个状态，供 Wokwi 截图验证
; 仿真屏强制 IPS 反转、rotation 语义与真机不同，因此 invert=0 + rotation=0
[env:simdemo]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DAGENTPET_SIM_DEMO
    -DLCD_INVERT=0
    -DLCD_ROTATION=0
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3
